strategy:
  type: blueGreen

canary:
  analysis:
    enabled: false

blueGreen:
  autoPromotionEnabled: true
  autoPromotionSeconds: 900
  scaleDownDelaySeconds: 900
  previewReplicaCount: 1
  analysis:
    enabled: false

replicaCount: 1

image:
  repository: acrdemonbs.azurecr.io/crud-app
  pullPolicy: IfNotPresent
  tag: "20251108.19"

imagePullSecrets: []

secret:
  enabled: false

configMap:
  enabled: false

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false

ingress:
  enabled: false

envFrom: []

java:
  javaOpts: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  springProfiles: "prod"
  port: 8080
serviceAccount:
  create: true

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 500Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - java-app-rollout
          topologyKey: kubernetes.io/hostname

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:mysql://my-mariadb:3306/userdb?useSSL=false&serverTimezone=UTC"
  - name: SPRING_DATASOURCE_USERNAME
    value: "root"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "ZDUjdJIwc4mRInpK"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "com.mysql.jdbc.Driver"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SPRING_JPA_SHOW_SQL
    value: "false"

volumeMounts: []

volumes: []

podDisruptionBudget:
  enabled: false
