strategy:
  type: blueGreen

blueGreen:
  autoPromotionEnabled: false
  autoPromotionSeconds: 30
  scaleDownDelaySeconds: 60
  previewReplicaCount: 1

replicaCount: 1

image:
  repository: acrdemonbs.azurecr.io/crud-app
  pullPolicy: IfNotPresent
  tag: "20251108.18"

imagePullSecrets: []

java:
  javaOpts: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  springProfiles: "prod"
  port: 8080
  managementPort: 8081

serviceAccount:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  stable:
    type: LoadBalancer
    port: 80
    targetPort: 8080
  preview:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 500Mi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - java-app-rollout
          topologyKey: kubernetes.io/hostname

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SERVER_PORT
    value: "8080"
  - name: MANAGEMENT_SERVER_PORT
    value: "8081"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:mysql://my-mariadb:3306/userdb?useSSL=false&serverTimezone=UTC"
  - name: SPRING_DATASOURCE_USERNAME
    value: "root"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "rootpass"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "com.mysql.jdbc.Driver"
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: "update"
  - name: SPRING_JPA_SHOW_SQL
    value: "false"

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs

volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

podDisruptionBudget:
  enabled: false
