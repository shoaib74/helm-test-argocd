# Example Values for Canary Deployment Strategy

strategy:
  type: canary

replicaCount: 3

image:
  repository: acrdemonnbs.azurecr.io/my-java-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Azure Container Registry authentication
imagePullSecrets:
  - name: acr-secret

# Canary Strategy - Progressive Rollout
canary:
  maxSurge: "25%"
  maxUnavailable: 0
  steps:
    # 20% traffic to canary
    - setWeight: 20
    - pause: {duration: 2m}
    
    # 40% traffic to canary
    - setWeight: 40
    - pause: {duration: 2m}
    
    # 60% traffic to canary
    - setWeight: 60
    - pause: {duration: 2m}
    
    # 80% traffic to canary
    - setWeight: 80
    - pause: {duration: 1m}
    
    # Manual approval before 100%
    - pause: {}
  
  # Enable automated analysis with Prometheus
  analysis:
    enabled: true
    startingStep: 2
    successfulRunHistoryLimit: 5
    unsuccessfulRunHistoryLimit: 3
    prometheus:
      address: "http://prometheus-server.monitoring.svc.cluster.local"
    metrics:
      successRate:
        enabled: true
        interval: 30s
        threshold: 0.95  # 95% success rate required
        failureLimit: 3
      avgResponseTime:
        enabled: true
        interval: 30s
        threshold: 500  # 500ms max average response time
        failureLimit: 3

# Java Application Configuration
java:
  javaOpts: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs"
  springProfiles: "prod"
  port: 8080

# Service Configuration
service:
  stable:
    type: LoadBalancer
    port: 80
    targetPort: 8080
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/actuator/health"
  canary:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080

# Resource Management
resources:
  limits:
    cpu: 2000m
    memory: 3Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Health Checks for Spring Boot
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 30

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Environment Variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SERVER_PORT
    value: "8080"
  - name: TZ
    value: "Asia/Kolkata"

# Pod Annotations for Prometheus
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

# Anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - java-app-rollout
          topologyKey: kubernetes.io/hostname

