# Production-Ready Configuration with Ingress and Full Monitoring

strategy:
  type: canary

replicaCount: 5

image:
  repository: acrdemonnbs.azurecr.io/my-java-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets:
  - name: acr-secret

# Canary with Manual Gates
canary:
  maxSurge: "25%"
  maxUnavailable: 0
  steps:
    - setWeight: 10
    - pause: {duration: 5m}
    - setWeight: 25
    - pause: {duration: 5m}
    - setWeight: 50
    - pause: {}  # Manual approval
    - setWeight: 75
    - pause: {duration: 5m}
  
  analysis:
    enabled: true
    startingStep: 1
    prometheus:
      address: "http://prometheus-server.monitoring.svc.cluster.local"
    metrics:
      successRate:
        enabled: true
        interval: 60s
        threshold: 0.98  # 98% success rate for production
        failureLimit: 2
      avgResponseTime:
        enabled: true
        interval: 60s
        threshold: 300  # Strict 300ms SLA
        failureLimit: 2

java:
  javaOpts: "-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+PrintGCDetails -XX:+PrintGCDateStamps"
  springProfiles: "prod"
  port: 8080
  managementPort: 8081

# Production Services
service:
  stable:
    type: ClusterIP  # Using Ingress instead of LoadBalancer
    port: 80
    targetPort: 8080
  canary:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080

# Ingress with SSL
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: api.mycompany.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls-cert
      hosts:
        - api.mycompany.com

# Production Resources
resources:
  limits:
    cpu: 4000m
    memory: 6Gi
  requests:
    cpu: 2000m
    memory: 4Gi

# Optimized Health Checks
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 180
  periodSeconds: 15
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 40

# Aggressive Autoscaling
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# Strict PDB
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Production Environment Variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: SERVER_PORT
    value: "8080"
  - name: MANAGEMENT_SERVER_PORT
    value: "8081"
  - name: TZ
    value: "UTC"
  - name: JAVA_SECURITY_EGD
    value: "file:/dev/./urandom"

# ConfigMap for application.properties
configMap:
  enabled: true
  data:
    application.properties: |
      spring.application.name=my-java-app
      logging.level.root=INFO
      logging.level.com.mycompany=DEBUG
      server.tomcat.threads.max=200
      server.tomcat.accept-count=100
      server.tomcat.max-connections=10000
      spring.datasource.hikari.maximum-pool-size=20
      spring.datasource.hikari.minimum-idle=5

envFrom:
  - configMapRef:
      name: java-app-rollout
  - secretRef:
      name: app-secrets

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

# Node Affinity - Run on specific node pool
nodeSelector:
  workload: applications

# Spread across availability zones
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - java-app-rollout
        topologyKey: topology.kubernetes.io/zone
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - java-app-rollout
          topologyKey: kubernetes.io/hostname

