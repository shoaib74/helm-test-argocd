apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "java-app-rollout.fullname" . }}
  labels:
    {{- include "java-app-rollout.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "java-app-rollout.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "java-app-rollout.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "java-app-rollout.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.java.port }}
          protocol: TCP
        - name: management
          containerPort: {{ .Values.java.managementPort }}
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: {{ .Values.java.javaOpts | quote }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          {{- toYaml .Values.volumeMounts | nindent 10 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
    {{- if eq .Values.strategy.type "canary" }}
    canary:
      maxSurge: {{ .Values.canary.maxSurge }}
      maxUnavailable: {{ .Values.canary.maxUnavailable }}
      canaryService: {{ include "java-app-rollout.fullname" . }}-canary
      stableService: {{ include "java-app-rollout.fullname" . }}-stable
      {{- if .Values.ingress.enabled }}
      trafficRouting:
        nginx:
          stableIngress: {{ include "java-app-rollout.fullname" . }}
      {{- end }}
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
      {{- if .Values.canary.analysis.enabled }}
      analysis:
        templates:
        - templateName: {{ include "java-app-rollout.fullname" . }}-success-rate
        startingStep: {{ .Values.canary.analysis.startingStep }}
        args:
        - name: service-name
          value: {{ include "java-app-rollout.fullname" . }}-canary
      {{- end }}
    {{- else if eq .Values.strategy.type "blueGreen" }}
    blueGreen:
      activeService: {{ include "java-app-rollout.fullname" . }}-stable
      previewService: {{ include "java-app-rollout.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      {{- if .Values.blueGreen.autoPromotionEnabled }}
      autoPromotionSeconds: {{ .Values.blueGreen.autoPromotionSeconds }}
      {{- end }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      {{- if .Values.blueGreen.previewReplicaCount }}
      previewReplicaCount: {{ .Values.blueGreen.previewReplicaCount }}
      {{- end }}
      {{- if .Values.blueGreen.analysis.enabled }}
      prePromotionAnalysis:
        templates:
        - templateName: {{ include "java-app-rollout.fullname" . }}-success-rate
        args:
        - name: service-name
          value: {{ include "java-app-rollout.fullname" . }}-preview
      postPromotionAnalysis:
        templates:
        - templateName: {{ include "java-app-rollout.fullname" . }}-success-rate
        args:
        - name: service-name
          value: {{ include "java-app-rollout.fullname" . }}-stable
      {{- end }}
    {{- end }}

