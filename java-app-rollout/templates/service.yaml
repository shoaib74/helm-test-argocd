---
# Active Service (Production Traffic)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "java-app-rollout.fullname" . }}-active
  labels:
    {{- include "java-app-rollout.labels" . | nindent 4 }}
  {{- with .Values.service.active.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.active.type }}
  ports:
    - port: {{ .Values.service.active.port }}
      targetPort: {{ .Values.service.active.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "java-app-rollout.selectorLabels" . | nindent 4 }}
---
{{- if and (eq .Values.strategy.type "blueGreen") .Values.service.preview.enabled }}
# Preview Service (For testing new version before promotion)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "java-app-rollout.fullname" . }}-preview
  labels:
    {{- include "java-app-rollout.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.preview.type }}
  ports:
    - port: {{ .Values.service.preview.port }}
      targetPort: {{ .Values.service.preview.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "java-app-rollout.selectorLabels" . | nindent 4 }}
{{- end }}

